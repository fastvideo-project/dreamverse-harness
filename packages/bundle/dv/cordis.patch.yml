# The DreamVerse bundle patch: the DreamVerse plugins over dsh-base, for a profile that also stacks dsh-web-app (the
# chat page) or dsh-headless (one task per process). Rows that read the environment read these variables, which
# scripts/video-harness/launch.sh prepares:
#   DV_PROJECTS_FOLDER  the folder that holds the folders of new chats and projects (default <Documents>/deepseek-harness/DreamVerse)
#   DV_FFMPEG / DV_FFPROBE  media binaries
#   DV_PUBLIC_URL    origin that serves /dv/assets to remote viewers, for links in chat cards
#   DV_AGENT_PROVIDER / DV_AGENT_MODEL / DV_AGENT_REASONING  the agent's model route
#   DV_DEEPSEEK_BASE_URL  the OpenAI-compatible SGLang endpoint that serves DeepSeek (default http://10.244.6.153:30000/v1)
#   DV_DEEPSEEK_API_KEY   bearer token for that endpoint; the launch script exports `none` when unset
#   DV_AGENT_VISION       `0` makes inspect.image report that images are unsupported instead of calling the model
#   GROQ_API_KEY          key of the documented fallback route

- insert:
    # The model catalog: the models dv_shot_render and plans can name, which the agent reads through dv_models_list and
    # dv_models_get.
    - id: dv-openrouter
      name: '@dv/openrouter'

    - id: dv-ui-openrouter
      name: '@dv/ui-openrouter'

    - id: dv-models
      name: '@dv/models'

    # The community LoRAs this deployment publishes. dv_lora_list and dv_lora_get read this registry, and the video
    # providers offer their `extra.lora` parameter only for an adapter that both this row and the task's server allow,
    # so a server's allow-list must repeat each id it can load. The server was GPU-verified with the Realism People
    # adapter; the others list the strength range and trigger word of their model card, and a deployment widens
    # `targets` only after it verifies the adapter on its own checkpoint. The row is disabled with dv-fastvideo, the
    # only provider of `extra.lora`; a deployment that sets `disabled: false` on dv-fastvideo also sets it on this row.
    - id: dv-lora
      name: '@dv/lora'
      disabled: true
      config:
        adapters:
          - id: fal/MiniMax-H3-Realism-People-LoRA
            displayName: Realism People
            description: Photoreal skin, faces and hands for people in a shot. Trained on base H3 for text, image and
              reference to video, so its own scale is 1.0 and 0.6 to 0.8 gives a lighter touch.
            triggerWords: [r34l1sm]
            defaultStrength: 1.0
            minStrength: 0
            maxStrength: 1.5
            targets:
              - model: fasth3
                tasks: [t2v, ref2v]
            license: other (see the source page)
            sourceUrl: https://huggingface.co/fal/MiniMax-H3-Realism-People-LoRA
          - id: Jojocodex/minimax-h3-Camera-Motion-lora
            displayName: Camera Motion
            description: Named camera moves, such as push in, pull out, dolly, orbit, follow, aerial and crane. The
              trigger phrase opens the prompt, then the subject and the move.
            triggerWords: [camera motion]
            defaultStrength: 1.0
            minStrength: 0
            maxStrength: 1.2
            targets:
              - model: fasth3
                tasks: [t2v]
            license: Apache-2.0
            sourceUrl: https://huggingface.co/Jojocodex/minimax-h3-Camera-Motion-lora
          - id: KennethFal/vh5tape-vhs-lora-minimax-h3
            displayName: VHS Tape
            description: A worn 1980s VHS look with smeared detail, chroma bleed and tape hiss, at three trained
              damage tiers. The trigger opens the prompt, then the damage tier, then the scene.
            triggerWords: [vh5tape]
            defaultStrength: 1.0
            minStrength: 0
            maxStrength: 1.2
            targets:
              - model: fasth3
                tasks: [t2v]
            license: MiniMax-H3 Community License
            sourceUrl: https://huggingface.co/KennethFal/vh5tape-vhs-lora-minimax-h3
          - id: lovis93/studio-1939-old-animation-lora-minimax-h3
            displayName: Studio 1939
            description: A hand-painted golden-age animation look with gouache backgrounds and celluloid palettes.
              The trigger opens the prompt, and exhaustive art direction works better than a short prompt.
            triggerWords: [gulliv3r]
            defaultStrength: 0.9
            minStrength: 0
            maxStrength: 1.2
            targets:
              - model: fasth3
                tasks: [t2v]
            license: MiniMax-H3 Community License
            sourceUrl: https://huggingface.co/lovis93/studio-1939-old-animation-lora-minimax-h3
          - id: pablodawson/MiniMax-H3-360-Orbit-LoRA
            displayName: 360 Orbit
            description: A camera that circles the subject through a full orbit.
            triggerWords: []
            defaultStrength: 1.0
            minStrength: 0
            maxStrength: 1.5
            targets:
              - model: fasth3
                tasks: [t2v]
            license: other (see the source page)
            sourceUrl: https://huggingface.co/pablodawson/MiniMax-H3-360-Orbit-LoRA

    # Models on FastVideo servers, one server per task, each with the facts of its served model. A model or task left
    # out of `models` is not registered. The row is disabled, so dv-uniserve serves fasth3 for task ref2v; a deployment
    # sets `disabled: false` and replaces these local URLs and FastH3 facts with its servers' own in its profile
    # patch.
    - id: dv-fastvideo
      name: '@dv/fastvideo'
      disabled: true
      config:
        models:
          fasth3:
            ref2v:
              baseUrl: http://127.0.0.1:8029
              modelFacts:
                modelId: fasth3
                frameSizes: { '16:9': { 768p: [1344, 768] }, '9:16': { 768p: [768, 1344] }, '1:1': { 768p: [768, 768] } }
                numFramesByDurationSec: { 5: 124, 6: 158, 7: 175, 8: 192, 9: 226, 10: 243, 11: 277, 12: 294, 13: 328, 14: 345, 15: 362 }
                maxReferences: 12
                referenceMediaTypes: { image: { maxCount: 9 }, video: { maxCount: 3 }, audio: { maxCount: 3 } }
            t2v:
              baseUrl: http://127.0.0.1:8031
              modelFacts:
                modelId: fasth3
                frameSizes: { '16:9': { 768p: [1344, 768] }, '9:16': { 768p: [768, 1344] }, '1:1': { 768p: [768, 768] } }
                numFramesByDurationSec: { 5: 124, 6: 158, 7: 175, 8: 192, 9: 226, 10: 243, 11: 277, 12: 294, 13: 328, 14: 345, 15: 362 }
                maxReferences: 0
                referenceMediaTypes: {}

    # FastH3 Omni 8-Step V1 on the cluster's UniServe server: the provider of fasth3 for task ref2v. A deployment with
    # another server replaces this row's config.
    - id: dv-uniserve
      name: '@dv/uniserve'
      config:
        baseUrl: http://10.244.8.35:8000

    - id: dv-ffmpeg
      name: '@dv/ffmpeg'
      config:
        ffmpegPath: !!js process.env.DV_FFMPEG || '/mnt/lustre/vlm-d1su/opt/ffmpeg-native/bin/ffmpeg'
        ffprobePath: !!js process.env.DV_FFPROBE || 'ffprobe'

    - id: dv-project
      name: '@dv/project'
      config:
        projectsFolder: !!js process.env.DV_PROJECTS_FOLDER

    - id: dv-canvas
      name: '@dv/canvas'

    - id: dv-asset-pool
      name: '@dv/asset-pool'
      config:
        publicBaseUrl: !!js process.env.DV_PUBLIC_URL || ''

    - id: dv-inspector
      name: '@dv/inspector'
      config:
        imageInput: !!js process.env.DV_AGENT_VISION !== '0'

    - id: dv-audio-edit
      name: '@dv/audio-edit'

    - id: dv-shot-render
      name: '@dv/shot-render'

    - id: dv-sglang-diffusion
      name: '@dv/sglang-diffusion'
      config:
        models:
          qwen-image-2.1-turbo:
            baseUrl: http://127.0.0.1:30010

    - id: dv-image-generate
      name: '@dv/image-generate'

    - id: dv-sglang-omni
      name: '@dv/sglang-omni'
      config:
        models:
          fish-audio-drama-3:
            baseUrl: http://127.0.0.1:8000

    - id: dv-audio-generate
      name: '@dv/audio-generate'

    - id: dv-character
      name: '@dv/character'

    - id: dv-location
      name: '@dv/location'

    - id: dv-style
      name: '@dv/style'

    - id: dv-text-node
      name: '@dv/text-node'

    - id: dv-timeline
      name: '@dv/timeline'

    # The workflow skills, such as story-directing, which hold the order of calls of each workflow.
    - id: dv-workflow-story
      name: '@dv/workflow-story'

    # dv: mentions in chat messages and chat image import.
    - id: dv-chat-references
      name: '@dv/chat-references'

    # The browser API for the interface plugins, and the interface plugins themselves.
    - id: dv-api
      name: '@dv/api'
      config:
        keepaliveMs: 15000

    - id: dv-ui-composer
      name: '@dv/ui-composer'

    - id: dv-ui-shot-render
      name: '@dv/ui-shot-render'

    - id: dv-ui-image-generate
      name: '@dv/ui-image-generate'

    - id: dv-ui-audio-generate
      name: '@dv/ui-audio-generate'

    - id: dv-ui-media
      name: '@dv/ui-media'

    - id: dv-ui-canvas
      name: '@dv/ui-canvas'

    - id: dv-ui-timeline
      name: '@dv/ui-timeline'

    - id: dv-ui-asset-pool
      name: '@dv/ui-asset-pool'

    - id: dv-ui-history
      name: '@dv/ui-history'

    - id: dv-ui-character
      name: '@dv/ui-character'

    - id: dv-ui-location
      name: '@dv/ui-location'

    - id: dv-ui-style
      name: '@dv/ui-style'

    - id: dv-ui-text-node
      name: '@dv/ui-text-node'

    - id: dv-ui-shell
      name: '@dv/ui-shell'

    # The MCP tools in the entry page's 探索 section; their names match the presets of the dv-mcp-presets row.
    - id: dv-ui-mcp-presets
      name: '@dv/ui-mcp-presets'

    - id: dv-ui-skills
      name: '@dv/ui-skills'

# The video-directing skill ships in this bundle's skills directory; skill-filesystem discovers it beside the user's own.
# The model, character, location, style, text node, timeline and story skills are registered by their plugins through ctx.skills.
- id: skill-filesystem
  config:
    customSkillDirs:
      - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dv/bundle/package.json')), 'skills')

# DreamVerse identity. The host prompt drops the harness opener and states the creator-facing persona, which the
# headless profile uses as is; the Web surface's prompt section (Web GUI URL, harness checkout) is left out, because
# creators talk to a video assistant, not to a coding harness.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: &dreamverse-persona >-
      You are the DreamVerse video assistant. You help creators plan, render, and edit videos in their DreamVerse
      project: characters and reference images, shots, takes, and the clips of each timeline. You work through the
      tools and skills listed for you. Reply in plain words a creator understands; mention record IDs, asset IDs, and
      tool names only when the user asks for them.
    personaSuffix: ''

- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# The Web agent preset of every DreamVerse chat: the persona above, the directing skills only, questions to the user,
# and context compaction. It mounts no shell, file, web, delegation, goal, or plan-mode tools; the video tools come
# from the dv-* rows on the host. The chooser is hidden, so every chat uses this preset.
- id: agent-preset-registry
  config:
    default: dreamverse
    modeSelectionEnabled: false

- insert:
    - id: preset-dreamverse
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dreamverse
        name: DreamVerse
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: *dreamverse-persona
              includeRuntimeContext: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dv/bundle/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

# The agent model: DeepSeek V4.1 served by SGLang on the cluster through its OpenAI-compatible API. No installed pi-ai
# catalog describes that server, so the route is declared by hand with the model's modalities and thinking levels; the
# server accepts the catalog id `deepseek-v4.1` as sent. pi-ai's OpenAI implementation insists on a bearer token, so the
# launch script exports DV_DEEPSEEK_API_KEY=none for a keyless server. pi-ai does not recognize the server's address as
# DeepSeek, so it would send the system prompt of a reasoning model as role `developer`, and SGLang drops a
# `developer` message from a request without tools; `supportsDeveloperRole: false` sends it as role `system`. Groq stays
# available as the documented fallback: DV_AGENT_PROVIDER=groq DV_AGENT_MODEL=qwen/qwen3.8-27b.
- id: llm-pi-ai
  config:
    providers:
      deepseek-local:
        apiKeyEnv: DV_DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DV_DEEPSEEK_BASE_URL || 'http://10.244.6.153:30000/v1'
        compat:
          supportsDeveloperRole: false
        models:
          - id: deepseek-v4.1
            name: DeepSeek V4.1 (SGLang)
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
      groq:
        apiKeyEnv: GROQ_API_KEY

- id: agent-default-model
  config:
    provider: !!js process.env.DV_AGENT_PROVIDER || 'deepseek-local'
    model: !!js process.env.DV_AGENT_MODEL || 'deepseek-v4.1'
    reasoningEffort: !!js process.env.DV_AGENT_REASONING || 'low'

# DreamVerse references project items through @dv/ui-composer's `@` source; DSH's file and session `@`
# source would list the project's record files and the sessions of every project.
- id: ui-reference
  disabled: true

# agent-default-model initializes each session; the operator picker changes its route for the next request.
- id: ui-model-selection
  disabled: false

# Completed turns show no token-usage pill; the composer statistics are hidden by @dv/ui-shell.
- id: ui-chat
  config:
    performanceUsage: compact

# The MCP servers DreamVerse suggests on the entry page's 探索 section. The row offers them to the MCP plugin's roster
# while that plugin is on and offers nothing while it is off; adding one is the person's choice.
- insert:
    - id: dv-mcp-presets
      name: '@dv/mcp-presets'
      config:
        presets:
          blender:
            title: Blender
            description: Let the agent build and inspect 3D scenes in a running Blender with the MCP for Blender add-on listening on port 9876.
            spec:
              transport: stdio
              command: uvx
              args: [mcp-for-blender@2.1.9]
              env: { BLENDER_HOST: 127.0.0.1, BLENDER_PORT: '9876', DISABLE_TELEMETRY: '1' }
          comfyui:
            title: ComfyUI
            description: Let the agent run ComfyUI workflows, watch jobs, and collect outputs from the ComfyUI at 127.0.0.1:8188.
            spec:
              transport: stdio
              command: uvx
              args: [comfy-mcp@0.10.0]
              env: { COMFYUI_URL: http://127.0.0.1:8188 }
