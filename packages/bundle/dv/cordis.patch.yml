# The DreamVerse bundle patch: the DreamVerse plugins over dsh-base, for a profile that also stacks dsh-web-app (the
# chat page) or dsh-headless (one task per process). Rows that read the environment read these variables, which
# scripts/video-harness/launch.sh prepares:
#   DV_STATE_ROOT    where assets, project records, session bindings, and view state live (default ~/.local/state/dv)
#   DV_FFMPEG / DV_FFPROBE  media binaries
#   DV_PUBLIC_URL    origin that serves /dv/assets to remote viewers, for links in chat cards
#   DV_AGENT_PROVIDER / DV_AGENT_MODEL / DV_AGENT_REASONING  the agent's model route
#   DV_DEEPSEEK_BASE_URL  the OpenAI-compatible SGLang endpoint that serves DeepSeek (default http://10.244.6.153:30000/v1)
#   DV_DEEPSEEK_API_KEY   bearer token for that endpoint; the launch script exports `none` when unset
#   DV_AGENT_VISION       `0` makes inspect.image report that images are unsupported instead of calling the model
#   GROQ_API_KEY          key of the documented fallback route

- insert:
    # The model catalog: the models dv_shot_render and plans can name, which the agent reads through dv_models_list and
    # dv_models_get.
    - id: dv-models
      name: '@dv/models'

    # Models on the cluster's FastVideo streaming_v2 servers, one server per task. A model or task left out of `models`
    # is not registered; a deployment with other servers replaces this row's config in its profile patch. The row is
    # disabled, so dv-uniserve serves fasth3 for task ref2v; a deployment sets `disabled: false` to mount it.
    - id: dv-fastvideo
      name: '@dv/fastvideo'
      disabled: true
      config:
        models:
          fasth3:
            ref2v:
              baseUrl: http://10.244.19.118:8029
              gpuSecondsPerVideoSecond: 4
            t2v:
              baseUrl: http://10.244.16.130:8031
              gpuSecondsPerVideoSecond: 1.5

    # FastH3 Omni 8-Step V1 on the cluster's UniServe server: the provider of fasth3 for task ref2v. A deployment with
    # another server replaces this row's config.
    - id: dv-uniserve
      name: '@dv/uniserve'
      config:
        baseUrl: http://10.244.8.35:8000
        gpuSecondsPerVideoSecond: 1.3

    - id: dv-ffmpeg
      name: '@dv/ffmpeg'
      config:
        ffmpegPath: !!js process.env.DV_FFMPEG || '/mnt/lustre/vlm-d1su/opt/ffmpeg-native/bin/ffmpeg'
        ffprobePath: !!js process.env.DV_FFPROBE || 'ffprobe'

    - id: dv-project
      name: '@dv/project'
      config:
        root: !!js >-
          process.getBuiltinModule('node:path').join(
          process.env.DV_STATE_ROOT || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state/dv'), 'projects')
        sessionRoot: !!js >-
          process.getBuiltinModule('node:path').join(
          process.env.DV_STATE_ROOT || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state/dv'), 'sessions')

    - id: dv-asset-pool
      name: '@dv/asset-pool'
      config:
        publicBaseUrl: !!js process.env.DV_PUBLIC_URL || ''
        root: !!js >-
          process.getBuiltinModule('node:path').join(
          process.env.DV_STATE_ROOT || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state/dv'), 'assets')

    - id: dv-inspector
      name: '@dv/inspector'
      config:
        imageInput: !!js process.env.DV_AGENT_VISION !== '0'

    - id: dv-shot-plan
      name: '@dv/shot-plan'

    - id: dv-shot-render
      name: '@dv/shot-render'

    - id: dv-sglang-diffusion
      name: '@dv/sglang-diffusion'
      config:
        models:
          qwen-image-2.1-turbo:
            baseUrl: http://127.0.0.1:30010
            gpuSecondsPerMegapixel: 0.6

    - id: dv-image-generate
      name: '@dv/image-generate'

    - id: dv-sglang-omni
      name: '@dv/sglang-omni'
      config:
        models:
          fish-audio-drama-3:
            baseUrl: http://127.0.0.1:8000
            gpuSecondsPerCall: 3

    - id: dv-audio-generate
      name: '@dv/audio-generate'

    - id: dv-character
      name: '@dv/character'

    - id: dv-location
      name: '@dv/location'

    - id: dv-style
      name: '@dv/style'

    - id: dv-timeline
      name: '@dv/timeline'

    # The story workflow: dv_story_preview and dv_story_approve preview and approve a plan version; its story-directing
    # skill holds the order of calls.
    - id: dv-workflow-story
      name: '@dv/workflow-story'

    # dv: mentions in chat messages and chat image import.
    - id: dv-chat-references
      name: '@dv/chat-references'

    # The browser API for the interface plugins, and the interface plugins themselves.
    - id: dv-api
      name: '@dv/api'
      config:
        keepaliveMs: 15000
        stateRoot: !!js >-
          process.env.DV_STATE_ROOT || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state/dv')

    - id: dv-ui-composer
      name: '@dv/ui-composer'

    - id: dv-ui-shot-render
      name: '@dv/ui-shot-render'

    - id: dv-ui-image-generate
      name: '@dv/ui-image-generate'

    - id: dv-ui-audio-generate
      name: '@dv/ui-audio-generate'

    - id: dv-ui-media
      name: '@dv/ui-media'

    - id: dv-ui-canvas
      name: '@dv/ui-canvas'

    - id: dv-ui-timeline
      name: '@dv/ui-timeline'

    - id: dv-ui-asset-pool
      name: '@dv/ui-asset-pool'

    - id: dv-ui-history
      name: '@dv/ui-history'

    - id: dv-ui-workflow-story
      name: '@dv/ui-workflow-story'

    - id: dv-ui-character
      name: '@dv/ui-character'

    - id: dv-ui-location
      name: '@dv/ui-location'

    - id: dv-ui-style
      name: '@dv/ui-style'

    - id: dv-ui-shot-plan
      name: '@dv/ui-shot-plan'

    - id: dv-ui-shell
      name: '@dv/ui-shell'

    # The MCP tools in the entry page's 探索 section; their names match the presets of the dv-mcp-presets row.
    - id: dv-ui-mcp-presets
      name: '@dv/ui-mcp-presets'

    - id: dv-ui-skills
      name: '@dv/ui-skills'

# The video-directing skill ships in this bundle's skills directory; skill-filesystem discovers it beside the user's own.
# The model, character, location, style, timeline and story skills are registered by their plugins through ctx.skills.
- id: skill-filesystem
  config:
    customSkillDirs:
      - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dv/bundle/package.json')), 'skills')

# DreamVerse identity. The host prompt drops the harness opener and states the creator-facing persona, which the
# headless profile uses as is; the Web surface's prompt section (Web GUI URL, harness checkout) is left out, because
# creators talk to a video assistant, not to a coding harness.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: &dreamverse-persona >-
      You are the DreamVerse video assistant. You help creators plan, render, and edit videos in their DreamVerse
      project: characters and reference images, shots, takes, and the clips of each timeline. You work through the
      tools and skills listed for you. Reply in plain words a creator understands; mention record IDs, asset IDs, and
      tool names only when the user asks for them.
    personaSuffix: ''

- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# The Web agent preset of every DreamVerse chat: the persona above, the directing skills only, questions to the user,
# and context compaction. It mounts no shell, file, web, delegation, goal, or plan-mode tools; the video tools come
# from the dv-* rows on the host. The chooser is hidden, so every chat uses this preset.
- id: agent-preset-registry
  config:
    default: dreamverse
    modeSelectionEnabled: false

- insert:
    - id: preset-dreamverse
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dreamverse
        name: DreamVerse
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: *dreamverse-persona
              includeRuntimeContext: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dv/bundle/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

# The agent model: DeepSeek V4.1 served by SGLang on the cluster through its OpenAI-compatible API. No installed pi-ai
# catalog describes that server, so the route is declared by hand with the model's modalities and thinking levels; the
# server accepts the catalog id `deepseek-v4.1` as sent. pi-ai's OpenAI implementation insists on a bearer token, so the
# launch script exports DV_DEEPSEEK_API_KEY=none for a keyless server. pi-ai does not recognize the server's address as
# DeepSeek, so it would send the system prompt of a reasoning model as role `developer`, and SGLang drops a
# `developer` message from a request without tools; `supportsDeveloperRole: false` sends it as role `system`. Groq stays
# available as the documented fallback: DV_AGENT_PROVIDER=groq DV_AGENT_MODEL=qwen/qwen3.8-27b.
- id: llm-pi-ai
  config:
    providers:
      deepseek-local:
        apiKeyEnv: DV_DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DV_DEEPSEEK_BASE_URL || 'http://10.244.6.153:30000/v1'
        compat:
          supportsDeveloperRole: false
        models:
          - id: deepseek-v4.1
            name: DeepSeek V4.1 (SGLang)
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
      groq:
        apiKeyEnv: GROQ_API_KEY

- id: agent-default-model
  config:
    provider: !!js process.env.DV_AGENT_PROVIDER || 'deepseek-local'
    model: !!js process.env.DV_AGENT_MODEL || 'deepseek-v4.1'
    reasoningEffort: !!js process.env.DV_AGENT_REASONING || 'low'

# DreamVerse references project items through @dv/ui-composer's `@` source; DSH's file and session `@`
# source would list the project's record files and the sessions of every project.
- id: ui-reference
  disabled: true

# The model is fixed by agent-default-model; the composer shows no model picker and no /model command.
- id: ui-model-selection
  disabled: true

# Completed turns show no token-usage pill; the composer statistics are hidden by @dv/ui-shell.
- id: ui-chat
  config:
    performanceUsage: compact

# The MCP servers DreamVerse suggests on the entry page's 探索 section. The row offers them to the MCP plugin's roster
# while that plugin is on and offers nothing while it is off; adding one is the person's choice.
- insert:
    - id: dv-mcp-presets
      name: '@dv/mcp-presets'
      config:
        presets:
          blender:
            title: Blender
            description: Let the agent build and inspect 3D scenes in a running Blender with the MCP for Blender add-on listening on port 9876.
            spec:
              transport: stdio
              command: uvx
              args: [mcp-for-blender@2.1.9]
              env: { BLENDER_HOST: 127.0.0.1, BLENDER_PORT: '9876', DISABLE_TELEMETRY: '1' }
          comfyui:
            title: ComfyUI
            description: Let the agent run ComfyUI workflows, watch jobs, and collect outputs from the ComfyUI at 127.0.0.1:8188.
            spec:
              transport: stdio
              command: uvx
              args: [comfy-mcp@0.10.0]
              env: { COMFYUI_URL: http://127.0.0.1:8188 }
