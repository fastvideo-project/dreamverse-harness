# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: workspace
      name: '../../../packages/workspace/workspace/src/index.ts'
    - id: dv-project
      name: '../../../packages/dv/project/src/index.ts'
      config:
        projectsFolder: !!js process.cwd()
    - id: dv-models
      name: '../../../packages/dv/models/src/index.ts'
    - id: dv-shot-render
      name: '../../../packages/dv/shot-render/src/index.ts'
    - id: continuation-catalog
      name: './catalog.mjs'
    - id: dv-workflow-story
      name: '../../../packages/dv/workflow-story/src/index.ts'
