# Keyless replay counterpart: the Blender bridge stays real with no Blender
# connected; only the model adapter is replaced by replay. The replay model
# declares the context window, output budget and reasoning effort that
# dsh-llm-deepseek reported for the recorded thinking-off request.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', low, high, max]
                defaultReasoningEffort: 'off'

    - id: dv-blender
      name: '@fastvideo/dreamverse-blender-bridge'
